spring:
  application:
    name: relais-gateway
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/relais
    username: ${DB_USER:relais}
    password: ${POSTGRES_PASSWORD:relais}
  flyway:
    schemas: relais          # Flyway crée le schéma s'il n'existe pas
    default-schema: relais   # et y range sa table d'historique

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always